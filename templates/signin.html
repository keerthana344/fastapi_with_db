{% extends "base.html" %}

{% block title %}Sign In | Antigravity App{% endblock %}

{% block extra_css %}
<style>
    :root {
        --primary: #c084fc;
        --primary-hover: #a855f7;
        --bg: #0f172a;
        --card-bg: #1e293b;
        --text: #f8fafc;
        --text-secondary: #94a3b8;
        --input-bg: #334155;
        --glass: rgba(255, 255, 255, 0.05);
    }

    body {
        font-family: 'Outfit', sans-serif;
        background: var(--bg);
        color: var(--text);
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: calc(100vh - 80px);
        /* Adjust for header */
        margin: 0;
        overflow: hidden;
    }

    .background-blob {
        position: absolute;
        width: 500px;
        height: 500px;
        background: radial-gradient(circle, var(--primary) 0%, transparent 70%);
        filter: blur(80px);
        opacity: 0.15;
        z-index: -1;
        animation: move 20s infinite alternate-reverse;
    }

    @keyframes move {
        from {
            transform: translate(20%, -20%);
        }

        to {
            transform: translate(-20%, 20%);
        }
    }

    .card {
        background: var(--card-bg);
        padding: 2.5rem;
        border-radius: 1.5rem;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        width: 100%;
        max-width: 400px;
        border: 1px solid var(--glass);
        backdrop-filter: blur(10px);
        animation: fadeIn 0.6s ease-out;
    }

    @keyframes fadeIn {
        from {
            opacity: 0;
            transform: translateY(20px);
        }

        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    h1 {
        font-size: 2rem;
        font-weight: 600;
        margin-bottom: 0.5rem;
        text-align: center;
        background: linear-gradient(to right, #c084fc, #818cf8);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
    }

    p.subtitle {
        color: var(--text-secondary);
        text-align: center;
        margin-bottom: 2rem;
        font-size: 0.95rem;
    }

    .form-group {
        margin-bottom: 1.25rem;
    }

    label {
        display: block;
        margin-bottom: 0.5rem;
        font-size: 0.9rem;
        color: var(--text-secondary);
    }

    input {
        width: 100%;
        padding: 0.75rem 1rem;
        border-radius: 0.75rem;
        background: var(--input-bg);
        border: 1px solid transparent;
        color: var(--text);
        font-size: 1rem;
        transition: all 0.2s;
        box-sizing: border-box;
    }

    input:focus {
        outline: none;
        border-color: var(--primary);
        box-shadow: 0 0 0 4px rgba(192, 132, 252, 0.1);
    }

    button {
        width: 100%;
        padding: 0.75rem;
        border-radius: 0.75rem;
        background: var(--primary);
        color: white;
        border: none;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s;
        margin-top: 1rem;
    }

    button:hover {
        background: var(--primary-hover);
        transform: translateY(-1px);
    }

    button:active {
        transform: translateY(0);
    }

    .footer {
        margin-top: 1.5rem;
        text-align: center;
        font-size: 0.9rem;
        color: var(--text-secondary);
    }

    .footer a {
        color: var(--primary);
        text-decoration: none;
        font-weight: 600;
    }

    .footer a:hover {
        text-decoration: underline;
    }
</style>
{% endblock %}

{% block content %}
<div class="background-blob"></div>
<div class="card" style="margin: 0 auto;">
    <h1>Welcome Back</h1>
    <p class="subtitle">Enter your credentials to sign in</p>
    <form id="signinForm">
        <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" required placeholder="name@company.com">
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required placeholder="••••••••">
        </div>
        <div id="errorMessage" style="color: #ef4444; font-size: 0.85rem; margin-top: 0.5rem; display: none;"></div>
        <button type="submit" id="submitBtn">Sign In</button>
    </form>
    <div class="footer">
        Don't have an account? <a href="/signup">Sign Up</a>
    </div>
</div>

<script>
    document.getElementById('signinForm').addEventListener('submit', async (e) => {
        e.preventDefault();

        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const submitBtn = document.getElementById('submitBtn');
        const errorMessage = document.getElementById('errorMessage');

        // Disable button and show loading state
        submitBtn.disabled = true;
        submitBtn.textContent = 'Signing in...';
        errorMessage.style.display = 'none';

        try {
            const response = await fetch('/login', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ email, password })
            });

            if (response.ok) {
                const data = await response.json();

                // Store JWT token in localStorage
                localStorage.setItem('auth_token', data.access_token);

                // Set cookie for backward compatibility
                document.cookie = `user=${email}; path=/`;

                // Redirect to dashboard
                window.location.href = '/dashboard';
            } else {
                const error = await response.json();
                errorMessage.textContent = error.detail || 'Invalid email or password';
                errorMessage.style.display = 'block';
                submitBtn.disabled = false;
                submitBtn.textContent = 'Sign In';
            }
        } catch (error) {
            console.error('Login error:', error);
            errorMessage.textContent = 'An error occurred. Please try again.';
            errorMessage.style.display = 'block';
            submitBtn.disabled = false;
            submitBtn.textContent = 'Sign In';
        }
    });
</script>
{% endblock %}
