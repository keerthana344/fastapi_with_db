<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Antigravity App{% endblock %}</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #6366f1;
            --secondary: #c084fc;
            --bg: #0b0f1a;
            --sidebar-bg: #111827;
            --card-bg: #1e293b;
            --text: #f8fafc;
            --text-secondary: #94a3b8;
            --glass: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --accent: #818cf8;
            --sidebar-width: 260px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            overflow-x: hidden;
        }

        /* Sidebar Styles */
        .sidebar {
            width: var(--sidebar-width);
            height: 100vh;
            background: var(--sidebar-bg);
            border-right: 1px solid var(--glass-border);
            position: fixed;
            left: 0;
            top: 0;
            display: flex;
            flex-direction: column;
            z-index: 1000;
            transition: all 0.3s ease;
        }

        .sidebar-header {
            padding: 2rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .logo-icon {
            width: 35px;
            height: 35px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            color: white;
        }

        .logo-text {
            font-size: 1.25rem;
            font-weight: 600;
            letter-spacing: -0.5px;
            background: linear-gradient(to right, #fff, #94a3b8);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .sidebar-nav {
            flex: 1;
            padding: 1rem;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 0.85rem 1.25rem;
            color: var(--text-secondary);
            text-decoration: none;
            border-radius: 0.75rem;
            margin-bottom: 0.5rem;
            transition: all 0.2s ease;
            font-weight: 400;
        }

        .nav-item i {
            font-size: 1.1rem;
            width: 20px;
            text-align: center;
        }

        .nav-item:hover,
        .nav-item.active {
            color: white;
            background: var(--glass);
        }

        .nav-item.active {
            background: rgba(99, 102, 241, 0.1);
            color: var(--primary);
            border: 1px solid rgba(99, 102, 241, 0.2);
        }

        .sidebar-footer {
            padding: 1.5rem;
            border-top: 1px solid var(--glass-border);
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.5rem;
            border-radius: 0.75rem;
            cursor: pointer;
            transition: background 0.2s;
        }

        .user-profile:hover {
            background: var(--glass);
        }

        .avatar {
            width: 32px;
            height: 32px;
            background: var(--glass);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 0.8rem;
            color: var(--secondary);
            border: 1px solid var(--glass-border);
        }

        /* Main Content */
        .main-wrapper {
            flex: 1;
            margin-left: var(--sidebar-width);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .topbar {
            height: 70px;
            background: rgba(11, 15, 26, 0.8);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--glass-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 2.5rem;
            position: sticky;
            top: 0;
            z-index: 900;
        }

        .search-container {
            position: relative;
            width: 300px;
        }

        .search-container i {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .search-container input {
            width: 100%;
            padding: 0.6rem 1rem 0.6rem 2.8rem;
            background: var(--glass);
            border: 1px solid var(--glass-border);
            border-radius: 2rem;
            color: white;
            font-family: inherit;
            font-size: 0.9rem;
            transition: all 0.2s;
        }

        .search-container input:focus {
            outline: none;
            border-color: var(--primary);
            background: rgba(255, 255, 255, 0.05);
        }

        .topbar-actions {
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }

        .action-btn {
            color: var(--text-secondary);
            font-size: 1.2rem;
            cursor: pointer;
            transition: color 0.2s;
            position: relative;
        }

        .action-btn:hover {
            color: white;
        }

        .notification-dot {
            position: absolute;
            top: -2px;
            right: -2px;
            width: 8px;
            height: 8px;
            background: #ef4444;
            border-radius: 50%;
            border: 2px solid var(--bg);
        }

        .content-area {
            padding: 2.5rem;
            max-width: 1400px;
            width: 100%;
            margin: 0 auto;
        }

        /* Auth Layout Override */
        .auth-body {
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at top right, rgba(99, 102, 241, 0.05), transparent),
                radial-gradient(circle at bottom left, rgba(192, 132, 252, 0.05), transparent);
        }

        .auth-sidebar {
            display: none;
        }

        .auth-main {
            margin-left: 0;
        }

        .auth-topbar {
            display: none;
        }

            {
            % block extra_css %
        }

            {
            % endblock %
        }
    </style>
</head>

<body class="{% if is_auth %}auth-body{% endif %}">
    {% if not is_auth %}
    <aside class="sidebar">
        <div class="sidebar-header">
            <div class="logo-icon">A</div>
            <div class="logo-text">Antigravity</div>
        </div>
        <nav class="sidebar-nav">
            <a href="/dashboard" class="nav-item active">
                <i class="fa-solid fa-house"></i> Dashboard
            </a>
            <a href="/projects" class="nav-item">
                <i class="fa-solid fa-layer-group"></i> Projects
            </a>
            <a href="/messages" class="nav-item">
                <i class="fa-solid fa-message"></i> Messages
            </a>
            <a href="/analytics" class="nav-item">
                <i class="fa-solid fa-chart-pie"></i> Analytics
            </a>
            <a href="/settings" class="nav-item">
                <i class="fa-solid fa-gear"></i> Settings
            </a>
        </nav>
        <div class="sidebar-footer">
            {% if user %}
            <div class="user-profile">
                <div class="avatar">{{ user[0].upper() }}</div>
                <div style="flex: 1; overflow: hidden;">
                    <div style="font-size: 0.9rem; font-weight: 600; white-space: nowrap; text-overflow: ellipsis;">{{
                        user }}</div>
                    <div style="font-size: 0.75rem; color: var(--text-secondary);">Pro Plan</div>
                </div>
                <a href="/logout" style="color: var(--text-secondary);"><i
                        class="fa-solid fa-right-from-bracket"></i></a>
            </div>
            {% else %}
            <a href="/signin" class="nav-item"><i class="fa-solid fa-right-to-bracket"></i> Login</a>
            {% endif %}
        </div>
    </aside>
    {% endif %}

    <div class="main-wrapper {% if is_auth %}auth-main{% endif %}">
        {% if not is_auth %}
        <header class="topbar">
            <div class="search-container">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" placeholder="Search anything...">
            </div>
            <div class="topbar-actions">
                <div class="action-btn">
                    <i class="fa-regular fa-bell"></i>
                    <div class="notification-dot"></div>
                </div>
                <div class="action-btn">
                    <i class="fa-regular fa-moon"></i>
                </div>
                <div style="width: 1px; height: 24px; background: var(--glass-border);"></div>
                <div class="action-btn">
                    <i class="fa-solid fa-plus"></i>
                </div>
            </div>
        </header>
        {% endif %}

        <main class="content-area">
            {% block content %}{% endblock %}
        </main>
    </div>
</body>

</html>
